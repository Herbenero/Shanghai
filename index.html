<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shanghai Darts Mobile</title>
    <style>
        :root {
            --primary: #007bff;
            --secondary: #6c757d;
            --success: #28a745;
            --warning: orange;
            --bg: #f8f9fa;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; 
            padding: 10px; 
            background: var(--bg);
            touch-action: manipulation; /* Prevents double-tap zoom delay */
        }

        /* Setup Screen */
        #setup { 
            max-width: 500px; 
            margin: 20px auto; 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }

        input { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 10px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-size: 16px; /* Prevents iOS auto-zoom on focus */
            box-sizing: border-box;
        }

        /* Game Layout */
        #game { 
            display: none; 
            flex-direction: column; 
            gap: 15px; 
            max-width: 1000px; 
            margin: 0 auto; 
        }

        @media (min-width: 768px) {
            #game { flex-direction: row; align-items: flex-start; }
        }

        #winner-box { 
            display: none; 
            padding: 20px; 
            background: var(--warning); 
            color: white; 
            font-weight: bold; 
            font-size: 1.8rem; 
            text-align: center;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .controls { 
            flex: 1; 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* Large Touch Buttons */
        .btn-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-top: 20px; 
        }

        button { 
            padding: 20px; 
            font-size: 1.2rem; 
            font-weight: bold;
            cursor: pointer; 
            border: none; 
            border-radius: 10px; 
            background: var(--primary); 
            color: white; 
            transition: opacity 0.2s;
        }

        button:active { opacity: 0.7; }
        .btn-start { background: var(--success); width: 100%; }
        .miss { background: var(--secondary); grid-column: span 2; }

        /* Mobile Responsive Scoreboard */
        .scoreboard-wrapper {
            flex: 1.5;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .scoreboard-container { 
            display: flex; 
            overflow-x: auto; 
            padding: 0; 
            -webkit-overflow-scrolling: touch;
        }

        .player-col { 
            flex: 1;
            min-width: 85px; 
            text-align: center; 
            border-right: 1px solid #eee;
        }

        .player-header { 
            font-weight: bold; 
            padding: 15px 5px; 
            background: #f1f1f1;
            border-bottom: 2px solid var(--primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-cell { 
            padding: 8px 0; 
            border-bottom: 1px solid #eee; 
            font-size: 0.9rem;
            height: 20px;
        }

        .total-row { 
            font-weight: bold; 
            background: #e9ecef; 
            padding: 15px 0; 
            color: var(--primary);
            font-size: 1.1rem;
        }

        /* Full Screen Alerts */
        #alert-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: white; justify-content: center;
            align-items: center; font-size: 2.5rem; z-index: 100; text-align: center;
            padding: 20px; box-sizing: border-box;
        }

        .active-player-highlight { background: #e7f3ff; }
    </style>
</head>
<body>

<div id="setup">
    <h2 style="margin-top:0">Shanghai Darts</h2>
    <input type="text" id="playerName" placeholder="Enter Player Name" inputmode="text">
    <button onclick="addPlayer()" style="width:100%; margin-bottom:10px;">+ Add Player</button>
    <ul id="playerList" style="padding-left:20px; margin: 15px 0;"></ul>
    <button onclick="startGame()" class="btn-start">Start Game</button>
</div>

<div id="game">
    <div id="winner-box"></div>

    <div class="controls">
        <h2 id="round-title" style="margin:0; color:var(--primary)">Round 1</h2>
        <h3 id="turn-indicator" style="margin:10px 0">Waiting...</h3>
        <div style="font-size: 1.1rem; margin-bottom: 10px;">
            Dart: <span id="dart-count" style="font-weight:bold">1</span> / 3
        </div>
        
        <div class="btn-group">
            <button onclick="recordScore(1)">Single</button>
            <button onclick="recordScore(2)">Double</button>
            <button onclick="recordScore(3)">Triple</button>
            <button class="miss" onclick="recordScore(0)">MISS</button>
        </div>
    </div>

    <div class="scoreboard-wrapper">
        <div class="scoreboard-container" id="scoreboard"></div>
    </div>
</div>

<div id="alert-overlay"></div>

<script>
    let players = [];
    let currentRound = 1;
    let currentPlayerIdx = 0;
    let currentDart = 1;

    function addPlayer() {
        const input = document.getElementById('playerName');
        const name = input.value.trim();
        if (name) {
            players.push({ name: name, scores: Array(20).fill(0), total: 0 });
            const li = document.createElement('li');
            li.textContent = name;
            document.getElementById('playerList').appendChild(li);
            input.value = '';
            input.focus();
        }
    }

    function startGame() {
        if (players.length === 0) return alert("Please add players first.");
        document.getElementById('setup').style.display = 'none';
        document.getElementById('game').style.display = 'flex';
        renderScoreboard();
        updateDisplay();
    }

    function recordScore(multiplier) {
        let points = multiplier * currentRound;
        players[currentPlayerIdx].scores[currentRound - 1] += points;
        players[currentPlayerIdx].total += points;

        if (currentDart < 3) {
            currentDart++;
        } else {
            nextTurn();
        }
        renderScoreboard();
        updateDisplay();
    }

    function nextTurn() {
        currentDart = 1;
        if (currentPlayerIdx < players.length - 1) {
            currentPlayerIdx++;
            showNextPlayerAlert();
        } else {
            if (currentRound < 20) {
                currentRound++;
                currentPlayerIdx = 0;
                showNextPlayerAlert();
            } else {
                endGame();
            }
        }
    }

    function showNextPlayerAlert() {
        const overlay = document.getElementById('alert-overlay');
        overlay.innerHTML = `<div><small style="display:block; font-size:1.2rem; opacity:0.8;">UP NEXT</small>${players[currentPlayerIdx].name}</div>`;
        overlay.style.display = 'flex';
        setTimeout(() => {
            overlay.style.display = 'none';
        }, 3000);
    }

    function updateDisplay() {
        document.getElementById('round-title').textContent = `Round ${currentRound}`;
        document.getElementById('turn-indicator').textContent = `${players[currentPlayerIdx].name}'s Turn`;
        document.getElementById('dart-count').textContent = currentDart;
    }

    function renderScoreboard() {
        const container = document.getElementById('scoreboard');
        container.innerHTML = '';
        players.forEach((p, idx) => {
            const col = document.createElement('div');
            col.className = `player-col ${idx === currentPlayerIdx ? 'active-player-highlight' : ''}`;
            let rows = `<div class="player-header">${p.name}</div>`;
            for (let i = 0; i < 20; i++) {
                const isCurrentRound = (i === currentRound - 1);
                rows += `<div class="score-cell" style="${isCurrentRound ? 'font-weight:bold; color:var(--primary);' : ''}">${p.scores[i] || '-'}</div>`;
            }
            rows += `<div class="total-row">${p.total}</div>`;
            col.innerHTML = rows;
            container.appendChild(col);
        });
    }

    function endGame() {
        const winner = players.reduce((prev, current) => (prev.total > current.total) ? prev : current);
        const box = document.getElementById('winner-box');
        box.style.display = 'block';
        box.textContent = `🏆 WINNER: ${winner.name}`;
        document.querySelector('.btn-group').style.display = 'none';
        document.getElementById('turn-indicator').textContent = "Game Over";
    }
</script>

</body>
</html>
