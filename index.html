<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hellcastle Shanghai</title>
  <style>
    :root {
      --primary: #007bff;
      --secondary: #6c757d;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #dc3545;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background: var(--bg);
      touch-action: manipulation;
    }
    .view-section {
      max-width: 600px;
      margin: 10px auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1, h2, h3 { margin-top: 0; color: #333; }
    .main-title {
      font-size: 1.5rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
      text-align: center;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .btn {
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      color: white;
      transition: opacity 0.2s;
      width: 100%;
      margin-bottom: 10px;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: var(--primary); }
    .btn-success { background: var(--success); }
    .btn-secondary { background: var(--secondary); }
    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    /* Game UI */
    #game {
      display: none;
      flex-direction: column;
      gap: 15px;
      max-width: 1000px;
      margin: 0 auto;
    }
    @media (min-width: 768px) {
      #game {
        flex-direction: row;
        align-items: flex-start;
      }
    }
    #winner-box {
      display: none;
      padding: 20px;
      background: var(--warning);
      color: #000;
      font-weight: bold;
      font-size: 1.5rem;
      text-align: center;
      border-radius: 12px;
      margin-bottom: 15px;
    }
    .controls {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    .btn-group.quad-mode {
      grid-template-columns: repeat(4, 1fr);
    }
    .btn-group .miss {
      grid-column: 1 / -1;
      background: var(--secondary);
    }

    /* Scoreboard */
    .scoreboard-wrapper {
      flex: 1.5;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .scoreboard-container {
      display: flex;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .player-col {
      flex: 1;
      min-width: 80px;
      text-align: center;
      border-right: 1px solid #eee;
    }
    .player-header {
      font-weight: bold;
      padding: 12px 5px;
      background: #f1f1f1;
      border-bottom: 2px solid var(--primary);
      font-size: 0.9rem;
    }
    .score-cell {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
      font-size: 0.85rem;
      height: 18px;
    }
    .total-row {
      font-weight: bold;
      background: #e9ecef;
      padding: 12px 0;
      color: var(--primary);
      font-size: 1rem;
    }

    /* History */
    .history-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-item:last-child { border-bottom: none; }
    .history-date { font-weight: bold; color: var(--secondary); font-size: 0.9rem; }

    #alert-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      color: white;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      z-index: 100;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-nav button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
    }
    .tab-nav button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <div id="setup" class="view-section">
    <h1 class="main-title">Hellcastle Shanghai</h1>
    <div class="tab-nav">
      <button id="tab-new" class="active" onclick="showTab('new')">New Game</button>
      <button id="tab-history" onclick="showTab('history')">History</button>
    </div>

    <div id="new-game-panel">
      <label style="font-size: 0.9rem; font-weight: bold;">Game Mode</label>
      <select id="gameMode">
        <option value="Shanghai">Shanghai (1-20)</option>
        <option value="Shanghai 7">Shanghai 7 (1-7)</option>
      </select>

      <label style="font-size: 0.9rem; font-weight: bold;">Board Type</label>
      <select id="boardType">
        <option value="Basic">Basic Board</option>
        <option value="Quad">Quad Board</option>
      </select>

      <label style="font-size: 0.9rem; font-weight: bold;">Game Date</label>
      <input type="date" id="gameDate">

      <div style="margin-top:15px;">
        <input type="text" id="playerName" placeholder="Player Name" inputmode="text">
        <button onclick="addPlayer()" class="btn btn-outline">+ Add Player</button>
      </div>
      <ul id="playerList" style="margin: 15px 0; font-size: 0.9rem;"></ul>

      <button onclick="startGame()" class="btn btn-success">Start Match</button>
    </div>

    <div id="history-panel" style="display:none;">
      <h3>Previous Games</h3>
      <div id="history-list"></div>
      <button onclick="clearHistory()" class="btn" style="background:var(--danger); margin-top:20px;">Clear All History</button>
    </div>
  </div>

  <div id="game">
  <!-- Winner Box Container with Image Inside -->
  <div id="winner-box">
    <div id="winner-text"></div>
    <div id="shanghai-display-container" style="margin-top: 15px; text-align: center;">
      <img id="shanghai-image" src="" alt="Shanghai Victory" style="display: none; max-width: 250px; height: auto; margin: 0 auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);" />
    </div>
  </div>

  <div class="controls">
    <h1 class="main-title" style="font-size: 1.1rem; margin-bottom: 5px;">Hellcastle Shanghai</h1>
    <div id="game-mode-indicator" style="font-size: 0.7rem; color: #888; margin-bottom:10px;">MODE: SHANGHAI</div>
    <h2 id="round-title" style="margin:0; color:var(--primary); font-size: 1.3rem;">Round 1</h2>
    <h3 id="turn-indicator" style="margin:10px 0; font-size: 1.1rem;">Waiting...</h3>
    <div style="font-size: 1rem; margin-bottom: 10px;">
      Dart: <span id="dart-count" style="font-weight:bold">1</span> / 3
    </div>
    ...

      <div class="btn-group" id="btn-group">
        <button class="btn btn-primary" onclick="recordScore(1)">S</button>
        <button class="btn btn-primary" onclick="recordScore(2)">D</button>
        <button class="btn btn-primary" onclick="recordScore(3)">T</button>
        <button class="btn btn-primary" id="btn-quad" style="display:none;" onclick="recordScore(4)">Q</button>
        <button class="btn miss" onclick="recordScore(0)">MISS</button>
      </div>

      <!-- Undo Button -->
      <button onclick="undoLastThrow()" class="btn btn-outline" style="margin-top:10px;">↩ Undo Last Dart</button>
      <button onclick="location.reload()" class="btn btn-secondary" style="margin-top:20px; font-size: 0.8rem;">Quit Game</button>
    </div>

    <div class="scoreboard-wrapper">
      <div class="scoreboard-container" id="scoreboard"></div>
    </div>
  </div>

  <div id="alert-overlay"></div>

  <script>
    // --- Shanghai Image Mapping & Handler ---
function getShanghaiImage(conditionName) {
  const imageMap = {
    'Shanghai': 'Shanghai.png',
    'Leap Shanghai': 'Leap-Shanghai.png',
    'Sky Shanghai': 'Sky-Shanghai.png',
    'Royal Shanghai': 'Royal-Shanghai.png'
  };

  return imageMap[conditionName] || null;
}

function handleShanghaiDisplay(conditionMet) {
  const imgElement = document.getElementById('shanghai-image');
  if (!imgElement) return;

  const imageSrc = getShanghaiImage(conditionMet);

  if (imageSrc) {
    imgElement.src = imageSrc;
    imgElement.style.display = 'block';
  } else {
    imgElement.style.display = 'none';
  }
}

// Example usage when checking turn results / end of turn:
// If a player hits a Shanghai scenario (e.g., 'Sky Shanghai'):
// handleShanghaiDisplay('Sky Shanghai');
//
// To clear/hide the image on a new turn or game reset:
// handleShanghaiDisplay(null);
    let players = [];
    let currentRound = 1;
    let currentPlayerIdx = 0;
    let currentDart = 1;
    let maxRounds = 20;
    let selectedMode = "Shanghai";
    let selectedBoard = "Basic";
    let gameDate = "";
    let currentTurnHits = { single: false, double: false, triple: false, quad: false };

    // --- State history for Undo functionality ---
    let stateHistory = [];

    document.getElementById('gameDate').valueAsDate = new Date();

    function showTab(tab) {
      document.getElementById('new-game-panel').style.display = tab === 'new' ? 'block' : 'none';
      document.getElementById('history-panel').style.display = tab === 'history' ? 'block' : 'none';
      document.getElementById('tab-new').className = tab === 'new' ? 'active' : '';
      document.getElementById('tab-history').className = tab === 'history' ? 'active' : '';
      if(tab === 'history') renderHistory();
    }

    function addPlayer() {
      const input = document.getElementById('playerName');
      const name = input.value.trim();
      if (name) {
        players.push({ name: name, scores: Array(20).fill(0), total: 0 });
        const li = document.createElement('li');
        li.textContent = name;
        document.getElementById('playerList').appendChild(li);
        input.value = '';
        input.focus();
      }
    }

    function startGame() {
      if (players.length === 0) return alert("Please add players first.");
      selectedMode = document.getElementById('gameMode').value;
      selectedBoard = document.getElementById('boardType').value;
      gameDate = document.getElementById('gameDate').value;
      maxRounds = selectedMode === "Shanghai 7" ? 7 : 20;

      document.getElementById('game-mode-indicator').textContent = `MODE: ${selectedMode.toUpperCase()} (${selectedBoard.toUpperCase()} BOARD)`;
      
      const btnGroup = document.getElementById('btn-group');
      const btnQuad = document.getElementById('btn-quad');
      if (selectedBoard === "Quad") {
        btnGroup.classList.add('quad-mode');
        btnQuad.style.display = 'block';
      } else {
        btnGroup.classList.remove('quad-mode');
        btnQuad.style.display = 'none';
      }

      document.getElementById('setup').style.display = 'none';
      document.getElementById('game').style.display = 'flex';
      renderScoreboard();
      updateDisplay();
    }

    // Save current snapshot before each dart throw
    function pushHistory() {
      stateHistory.push({
        players: JSON.parse(JSON.stringify(players)),
        currentRound,
        currentPlayerIdx,
        currentDart,
        currentTurnHits: { ...currentTurnHits }
      });
    }

    function checkShanghai() {
  const { single, double, triple, quad } = currentTurnHits;
  if (selectedBoard === "Quad") {
    if (single && double && triple) {
      return { hit: true, type: 'Shanghai', msg: "You got Shanghai! Game Over" };
    }
    if (single && double && quad) {
      return { hit: true, type: 'Leap Shanghai', msg: "You got a Leap Shanghai! Game Over!" };
    }
    if (single && triple && quad) {
      return { hit: true, type: 'Sky Shanghai', msg: "You got a Sky Shanghai! Game Over!" };
    }
    if (double && triple && quad) {
      return { hit: true, type: 'Royal Shanghai', msg: "You got a Royal Shanghai! Game Over!" };
    }
  } else {
    if (single && double && triple) {
      return { hit: true, type: 'Shanghai', msg: "You got Shanghai! Game Over" };
    }
  }
  return { hit: false, type: null, msg: "" };
}

    function recordScore(multiplier) {
      pushHistory();

      let points = multiplier * currentRound;
      players[currentPlayerIdx].scores[currentRound - 1] += points;
      players[currentPlayerIdx].total += points;

      if (multiplier === 1) currentTurnHits.single = true;
      if (multiplier === 2) currentTurnHits.double = true;
      if (multiplier === 3) currentTurnHits.triple = true;
      if (multiplier === 4) currentTurnHits.quad = true;

      const shanghaiResult = checkShanghai();
if (shanghaiResult.hit) {
  endGame(true, shanghaiResult.msg, shanghaiResult.type);
  return;
}

      if (currentDart < 3) {
        currentDart++;
      } else {
        nextTurn();
      }
      renderScoreboard();
      updateDisplay();
    }

    // Undo the last dart throw
    function undoLastThrow() {
  if (stateHistory.length === 0) {
    alert("No actions to undo!");
    return;
  }
  
  // Hide image if it was displayed
  handleShanghaiDisplay(null);

  // ... rest of undo logic
      const previousState = stateHistory.pop();
      players = previousState.players;
      currentRound = previousState.currentRound;
      currentPlayerIdx = previousState.currentPlayerIdx;
      currentDart = previousState.currentDart;
      currentTurnHits = previousState.currentTurnHits;

      // Restore UI state if game ended or buttons were hidden
      document.getElementById('btn-group').style.display = 'grid';
      document.getElementById('winner-box').style.display = 'none';
      renderScoreboard();
      updateDisplay();
    }

    function nextTurn() {
      currentDart = 1;
      currentTurnHits = { single: false, double: false, triple: false, quad: false };

      if (currentPlayerIdx < players.length - 1) {
        currentPlayerIdx++;
        showNextPlayerAlert();
      } else {
        if (currentRound < maxRounds) {
          currentRound++;
          currentPlayerIdx = 0;
          showNextPlayerAlert();
        } else {
          endGame(false, "");
        }
      }
    }

    function showNextPlayerAlert() {
      const overlay = document.getElementById('alert-overlay');
      overlay.innerHTML = `<div><small style="display:block; font-size:1rem; opacity:0.8;">UP NEXT</small>${players[currentPlayerIdx].name}</div>`;
      overlay.style.display = 'flex';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 1500);
    }

    function updateDisplay() {
      document.getElementById('round-title').textContent = `Round ${currentRound}`;
      document.getElementById('turn-indicator').textContent = `${players[currentPlayerIdx].name}'s Turn`;
      document.getElementById('dart-count').textContent = currentDart;
    }

    function renderScoreboard() {
      const container = document.getElementById('scoreboard');
      container.innerHTML = '';
      players.forEach((p, idx) => {
        const col = document.createElement('div');
        col.className = 'player-col';
        let rows = `<div class="player-header" style="${idx === currentPlayerIdx ? 'background:#e7f3ff;' : ''}">${p.name}</div>`;
        for (let i = 0; i < maxRounds; i++) {
          const isCurrentRound = (i === currentRound - 1);
          rows += `<div class="score-cell" style="${isCurrentRound ? 'font-weight:bold; color:var(--primary); background:#fcfcfc;' : ''}">${p.scores[i] || '-'}</div>`;
        }
        rows += `<div class="total-row">${p.total}</div>`;
        col.innerHTML = rows;
        container.appendChild(col);
      });
    }

    function endGame(isShanghai, shanghaiMsg, shanghaiType = null) {
  const winner = isShanghai ? players[currentPlayerIdx] : players.reduce((prev, current) => (prev.total > current.total) ? prev : current);
  const box = document.getElementById('winner-box');
  const winText = document.getElementById('winner-text');
  
  box.style.display = 'block';

  if (isShanghai) {
    box.style.background = "linear-gradient(45deg, #ff0000, #ffc107)";
    winText.innerHTML = `🔥 ${shanghaiMsg.toUpperCase()} 🔥<br><span style="font-size:1.2rem">${winner.name} wins instantly!</span>`;
    
    // Display the corresponding Shanghai image under the text banner
    handleShanghaiDisplay(shanghaiType);
  } else {
    box.style.background = "var(--warning)";
    winText.textContent = `🏆 WINNER: ${winner.name} (${winner.total})`;
    handleShanghaiDisplay(null);
  }

  document.getElementById('btn-group').style.display = 'none';
  document.getElementById('turn-indicator').textContent = "Game Complete";
  saveGame(winner, isShanghai, shanghaiMsg);
  renderScoreboard();
}

function undoLastThrow() {
  if (stateHistory.length === 0) {
    alert("No actions to undo!");
    return;
  }

  // Hide image if it was displayed
  handleShanghaiDisplay(null);

  const previousState = stateHistory.pop();
  players = previousState.players;
  currentRound = previousState.currentRound;
  currentPlayerIdx = previousState.currentPlayerIdx;
  currentDart = previousState.currentDart;
  currentTurnHits = previousState.currentTurnHits;

  // Restore UI state
  document.getElementById('btn-group').style.display = 'grid';
  document.getElementById('winner-box').style.display = 'none';
  renderScoreboard();
  updateDisplay();
}

    function saveGame(winner, isShanghai, shanghaiMsg) {
      const history = JSON.parse(localStorage.getItem('shanghai_history') || '[]');
      const gameRecord = {
        date: gameDate || new Date().toISOString().split('T')[0],
        mode: `${selectedMode} (${selectedBoard})`,
        winner: winner.name,
        score: winner.total,
        isShanghai: isShanghai,
        shanghaiMsg: shanghaiMsg,
        players: players.map(p => ({ name: p.name, total: p.total }))
      };
      history.unshift(gameRecord);
      localStorage.setItem('shanghai_history', JSON.stringify(history));
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      const history = JSON.parse(localStorage.getItem('shanghai_history') || '[]');
      if(history.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#888;">No games played yet.</p>';
        return;
      }
      list.innerHTML = history.map(game => `
        <div class="history-item">
          <div>
            <div class="history-date">${game.date}</div>
            <div class="history-meta">${game.mode} ${game.isShanghai ? `(${game.shanghaiMsg})` : ''}</div>
          </div>
          <div style="text-align:right">
            <div style="font-weight:bold; color:var(--success)">${game.winner}</div>
            <div style="font-size:0.8rem">${game.score} pts</div>
          </div>
        </div>
      `).join('');
    }

    function clearHistory() {
      if(confirm("Are you sure you want to delete all game history?")) {
        localStorage.removeItem('shanghai_history');
        renderHistory();
      }
    }
  </script>
</body>
</html>
